<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Service</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --code-bg: #f6f8fa;
        --link: #0969da;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --border: #30363d;
          --code-bg: #161b22;
          --link: #4493f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 24px 96px;
      }

      h1,
      h2,
      h3,
      h4 {
        font-weight: 600;
        line-height: 1.25;
        margin: 1.6em 0 0.6em;
      }
      h1 {
        font-size: 2em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--border);
      }
      h2 {
        font-size: 1.5em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--border);
      }
      h3 {
        font-size: 1.25em;
      }
      h4 {
        font-size: 1.05em;
      }
      h1:first-child {
        margin-top: 0;
      }

      p,
      ul,
      ol,
      table,
      blockquote {
        margin: 0 0 1em;
      }
      ul,
      ol {
        padding-left: 1.6em;
      }
      li + li {
        margin-top: 0.2em;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 0.88em;
        background: var(--code-bg);
        padding: 0.15em 0.4em;
        border-radius: 6px;
      }

      pre {
        background: var(--code-bg);
        border-radius: 8px;
        padding: 16px;
        overflow-x: auto;
      }
      pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
      }

      blockquote {
        margin-left: 0;
        padding: 0 1em;
        color: var(--muted);
        border-left: 0.25em solid var(--border);
      }

      table {
        display: block;
        overflow-x: auto;
        border-collapse: collapse;
        margin: 0 0 1em;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 6px 13px;
        text-align: left;
      }
      th {
        background: var(--code-bg);
        font-weight: 600;
      }

      hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 2em 0;
      }
      img {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <main><h1>Mail-Service</h1></main>
  </body>
</html>
